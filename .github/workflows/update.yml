name: 每日財資數據自動更新

on:
  schedule:
    # 每天台灣時間 05:00 (UTC 21:00)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: 安裝套件
        run: pip install requests google-genai
        
      - name: 執行爬蟲
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_data.py
        
      - name: 提交 data.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "自動更新：每日總經與活動資料" && git push)
